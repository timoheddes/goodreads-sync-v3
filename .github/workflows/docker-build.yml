name: Build and publish Docker image

# Builds a multi-arch (amd64 + arm64) image on every push to main and
# pushes it to GHCR. Portainer's GitOps redeploy pulls this image directly --
# the NAS never runs `docker build` itself, which is what caused the
# wrong-architecture build issues in v2.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/goodreads-sync-v3:latest
            ghcr.io/${{ github.repository_owner }}/goodreads-sync-v3:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
